<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#70c0e8" />
<meta name="description" content="Run Cynic's strict-only ECMAScript engine in the browser and inspect its output, bytecode, AST, and WebAssembly." />
<title>Cynic Playground</title>
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16.png" />
<style>
  :root {
    --canvas: #70c0e8;
    --paper: #fff8e6;
    --panel: #fff8e6;
    --ink: #0c0c0c;
    --ink-soft: #41413d;
    --line: #0c0c0c;
    --line-strong: #0c0c0c;
    --accent: #dc4a38;
    --accent-strong: #a92e21;
    --blue: #087aa4;
    --green: #6cbf3a;
    --yellow: #ffd521;
    --skin: #ffd521;
    --skin-shade: #e8b800;
    --bart: var(--accent);
    --marge: var(--blue);
    --grass: #6cbf3a;
    --sky: var(--canvas);
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --display: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    min-width: 320px;
    height: 100%;
    margin: 0;
  }

  body {
    color: var(--ink);
    background: var(--canvas);
    font-family: var(--sans);
    letter-spacing: 0;
    -webkit-font-smoothing: antialiased;
  }

  button, select, input { font: inherit; }

  button, select, a, input { outline: none; }

  button:focus-visible,
  select:focus-visible,
  a:focus-visible,
  input:focus-visible {
    outline: 3px solid var(--blue);
    outline-offset: 2px;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .app-shell {
    width: 100%;
    height: 100svh;
    min-height: 560px;
    display: grid;
    grid-template-rows: 64px minmax(0, 1fr) 34px;
  }

  .app-header {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 18px;
    background: var(--skin);
    border-bottom: 3px solid var(--ink);
  }

  .wordmark {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--ink);
    text-decoration: none;
    font: 24px/1 var(--display);
    text-transform: uppercase;
    line-height: 1;
  }

  .wordmark-mark {
    width: 36px;
    height: 36px;
    padding: 2px;
    background: var(--canvas);
    border: 2px solid var(--ink);
    border-radius: 5px;
    object-fit: contain;
  }

  .workspace-name {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 9px;
    font: 13px/1 var(--mono);
    color: var(--ink-soft);
  }

  .workspace-name::before { content: "/"; color: var(--line-strong); }

  .runtime-badge {
    padding: 4px 7px;
    border: 2px solid var(--ink);
    color: var(--ink-soft);
    background: #fff;
    font-size: 11px;
  }

  .header-nav {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 18px;
    font: 14px/1 var(--display);
    text-transform: uppercase;
  }

  .header-nav a {
    color: var(--ink-soft);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: color 140ms ease, border-color 140ms ease;
  }

  .header-nav a:hover { color: var(--ink); border-color: var(--ink); }

  .workspace {
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 16px;
    padding: 14px 18px 18px;
  }

  .panel {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--panel);
    border: 3px solid var(--ink);
    border-radius: 0;
    box-shadow: 5px 5px 0 var(--ink);
  }

  .panel-head {
    min-height: 50px;
    flex: 0 0 50px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    background: var(--skin);
    border-bottom: 3px solid var(--ink);
  }

  .panel-actions {
    min-width: 0;
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .snippets-select {
    width: min(230px, 44%);
    height: 32px;
    padding: 0 30px 0 9px;
    color: var(--ink);
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 0;
    font: 12px/1 var(--mono);
    cursor: pointer;
  }

  .action-button {
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 0 11px;
    border: 2px solid var(--ink);
    border-radius: 0;
    box-shadow: 2px 2px 0 var(--ink);
    background: #fff;
    color: var(--ink);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: background 140ms ease, border-color 140ms ease, transform 140ms ease, box-shadow 140ms ease;
  }

  .action-button:hover {
    background: var(--skin-shade);
    transform: translate(-1px, -1px);
    box-shadow: 3px 3px 0 var(--ink);
  }
  .action-button:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
  .action-button:disabled { opacity: .5; cursor: progress; transform: none; }
  .action-button .icon { font: 700 13px/1 var(--mono); }

  .btn-primary {
    color: var(--ink);
    background: var(--grass);
    border-color: var(--ink);
  }

  .btn-primary:hover { background: #8bd754; border-color: var(--ink); }

  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--ink-soft);
    font: 11px/1 var(--mono);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }

  .toggle input {
    appearance: none;
    -webkit-appearance: none;
    width: 30px;
    height: 18px;
    margin: 0;
    position: relative;
    flex: none;
    border: 2px solid var(--ink);
    border-radius: 9px;
    background: #fff;
    cursor: pointer;
    transition: background 140ms ease, border-color 140ms ease;
  }

  .toggle input::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    border: 1px solid var(--ink);
    transition: transform 140ms ease;
  }

  .toggle input:checked { background: var(--green); border-color: var(--ink); }
  .toggle input:checked::after { transform: translateX(12px); }

  #editor-host {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
  }

  #editor-host .cm-editor { height: 100%; }
  #editor-host .cm-scroller { font-family: var(--mono); }

  .panel-head-tabs { justify-content: space-between; }

  .mode-tabs {
    min-width: 0;
    display: inline-flex;
    align-items: stretch;
    overflow: hidden;
    border: 2px solid var(--ink);
    border-radius: 0;
    background: #fff;
  }

  .mode-tab {
    min-width: 62px;
    height: 30px;
    padding: 0 10px;
    color: var(--ink-soft);
    background: transparent;
    border: 0;
    border-right: 2px solid var(--ink);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: color 140ms ease, background 140ms ease;
  }

  .mode-tab:last-child { border-right: 0; }
  .mode-tab:hover { color: var(--ink); background: var(--skin-shade); }
  .mode-tab[aria-selected="true"] { color: #fff; background: var(--ink); }
  .mode-tab[hidden] { display: none; }

  .status {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--ink-soft);
    font: 11px/1 var(--mono);
  }

  .status::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 3px rgba(136, 184, 45, .16);
  }

  .output-wrap {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  pre.output {
    min-height: 0;
    flex: 1 1 auto;
    margin: 0;
    padding: 16px;
    overflow: auto;
    color: var(--ink);
    background: var(--paper);
    font: 13px/1.55 var(--mono);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .span-edge {
    position: absolute;
    left: 50%;
    z-index: 5;
    transform: translateX(-50%);
    pointer-events: none;
    padding: 3px 8px;
    color: var(--ink);
    background: rgba(242, 201, 76, .9);
    border: 1px solid #b89021;
    border-radius: 3px;
    font: 10px/1.2 var(--mono);
  }

  .span-edge[hidden] { display: none; }
  .span-edge-up { top: 8px; }
  .span-edge-down { bottom: 8px; }

  .out-stdout, .out-value, .out-error, .out-empty, .out-stats { display: block; }
  .out-value { color: var(--ink-soft); }
  .out-value::before { content: "=> "; color: var(--green); font-weight: 800; }
  .out-error { color: var(--accent-strong); font-weight: 700; }
  .out-empty { color: var(--ink-soft); }
  .out-hint { display: none; }

  .out-stats {
    margin-top: 14px;
    padding-top: 11px;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
    font-size: 11px;
    white-space: pre;
  }

  .out-stdout + .out-value,
  .out-stdout + .out-error {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--line-strong);
  }

  .bc-line { display: block; }
  .span-line { cursor: pointer; border-radius: 2px; }
  .span-line:hover, .span-active { background: rgba(242, 201, 76, .55); }
  .span-active-ancestor { background: rgba(242, 201, 76, .20); }

  .bc-tok-offset, .bc-tok-paren, .wat-tok-bytes { color: var(--ink-soft); }
  .bc-tok-mnem, .ast-tok-head { color: #8e287f; font-weight: 700; }
  .bc-tok-reg, .ast-tok-attr { color: var(--blue); }
  .bc-tok-index, .bc-tok-num, .ast-tok-num { color: #a84c12; }
  .bc-tok-jump, .ast-tok-ident { color: #08767d; }
  .ast-tok-paren { color: var(--ink-soft); }
  .ast-tok-string { color: #367611; }
  .wat-tok-comment { color: var(--ink-soft); font-style: italic; }

  .statusbar {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 18px;
    color: var(--ink-soft);
    background: var(--skin);
    border-top: 3px solid var(--ink);
    font: 10px/1 var(--mono);
    white-space: nowrap;
    overflow: hidden;
  }

  .statusbar strong { color: var(--ink); font-weight: 600; }
  .statusbar .sep { color: var(--line-strong); }

  @media (max-width: 900px) {
    .app-header { gap: 12px; }
    .runtime-badge { display: none; }
    .header-nav a:first-child { display: none; }
    .workspace { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(360px, 1fr) minmax(320px, .9fr); overflow: auto; }
    .app-shell { height: auto; min-height: 100svh; grid-template-rows: 60px auto 34px; }
    .panel { min-height: 320px; }
  }

  @media (max-width: 640px) {
    .app-header { padding: 0 12px; }
    .workspace-name { display: none; }
    .header-nav { gap: 12px; }
    .workspace { padding: 8px; gap: 8px; grid-template-rows: 430px 380px; }
    .panel-head { min-height: 92px; flex-basis: 92px; align-items: flex-start; flex-wrap: wrap; }
    .snippets-select { width: 100%; max-width: none; }
    .panel-actions { width: 100%; margin-left: 0; }
    .toggle { margin-right: auto; }
    .panel-head-tabs { min-height: 50px; flex-basis: 50px; flex-wrap: nowrap; align-items: center; }
    .mode-tab { min-width: 54px; padding: 0 8px; }
    .statusbar { padding: 0 10px; }
  }

  @media (max-width: 420px) {
    .wordmark { font-size: 18px; }
    .wordmark-mark { width: 28px; height: 28px; }
    .header-nav a:first-child { display: none; }
    .action-button { padding: 0 9px; }
    .action-button .button-label-share { display: none; }
    .mode-tab { min-width: 48px; font-size: 10px; }
    .status { font-size: 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <h1 class="sr-only">Cynic Playground</h1>
    <a class="wordmark" href="../" aria-label="Cynic project home">
      <img class="wordmark-mark" src="../assets/cynic-mascot-head.svg" alt="" width="36" height="36" />
      <span>Cynic</span>
    </a>
    <div class="workspace-name">
      <span>Playground</span>
      <span class="runtime-badge">wasm32-freestanding</span>
    </div>
    <nav class="header-nav" aria-label="Project links">
      <a href="https://github.com/chicoxyzzy/cynic/blob/main/README.md">Docs</a>
      <a href="https://github.com/chicoxyzzy/cynic">Source</a>
    </nav>
  </header>

  <main class="workspace">
    <section class="panel" aria-label="Source editor">
      <div class="panel-head">
        <label class="sr-only" for="snippets">Sample program</label>
        <select id="snippets" class="snippets-select" title="Load a sample program">
          <option value="">Sample program</option>
        </select>
        <div class="panel-actions">
          <label class="toggle" title="Use mutable primordials for eval mode">
            <input type="checkbox" id="unhardened" aria-label="Run unhardened">
            <span>unhardened</span>
          </label>
          <button id="share" type="button" class="action-button" title="Copy a link to this source">
            <span class="icon" aria-hidden="true">↗</span>
            <span class="button-label-share">Share</span>
          </button>
          <button id="run" type="button" class="action-button btn-primary" title="Run (Ctrl/Cmd+Enter)">
            <span class="icon" aria-hidden="true">▶</span>
            <span>Run</span>
          </button>
        </div>
      </div>
      <div id="editor-host"></div>
    </section>

    <section class="panel" aria-label="Engine output">
      <div class="panel-head panel-head-tabs">
        <div class="mode-tabs" role="tablist" aria-label="Output view">
          <button id="tab-eval" class="mode-tab" data-mode="eval" type="button" role="tab" tabindex="0" aria-selected="true" aria-controls="output">Eval</button>
          <button id="tab-bytecode" class="mode-tab" data-mode="bytecode" type="button" role="tab" tabindex="-1" aria-selected="false" aria-controls="output">Bytecode</button>
          <button id="tab-ast" class="mode-tab" data-mode="ast" type="button" role="tab" tabindex="-1" aria-selected="false" aria-controls="output">AST</button>
          <button id="tab-wasm" class="mode-tab" data-mode="wasm" type="button" role="tab" tabindex="-1" aria-selected="false" aria-controls="output">Wasm</button>
        </div>
        <span class="status" id="status" role="status" aria-live="polite">loading</span>
      </div>
      <div class="output-wrap">
        <pre class="output" id="output" role="tabpanel" tabindex="0" aria-labelledby="tab-eval"><span class="out-empty">Run something. Cynic will judge it.</span></pre>
        <div class="span-edge span-edge-up" id="span-edge-up" aria-hidden="true" hidden>▲ match above</div>
        <div class="span-edge span-edge-down" id="span-edge-down" aria-hidden="true" hidden>▼ match below</div>
      </div>
    </section>
  </main>

  <footer class="statusbar">
    <strong id="version">cynic-wasm</strong>
    <span class="sep">·</span>
    <span>strict-only</span>
    <span class="sep">·</span>
    <span>hardened</span>
    <span class="sep">·</span>
    <span>local browser runtime, no excuses</span>
  </footer>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
